CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Invert display colours from black-on-white to white-on-black
# CONFIG_ZMK_DISPLAY_INVERT=y
# CONFIG_NICE_VIEW_WIDGET_INVERTED=y

# Enable a widget to show the highest, active layer
# CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# If battery widget is enabled, show percentage instead of icons
# CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enable a widget to show the current output (USB/BLE)
# CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# Enable a widget to show words per minute
# CONFIG_ZMK_WIDGET_WPM_STATUS=n

# The nice!view shield includes a custom vertical widget.
# To use the built-in ZMK one, uncomment the following lines:
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
# CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
# CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

